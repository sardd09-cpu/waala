<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QAYA - قايا</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background-color: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 90vh;
            overflow: hidden;
        }
        .header {
            padding: 20px;
            background-color: #334155;
            text-align: center;
            border-bottom: 1px solid #475569;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #38bdf8;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
        }
        .user-message {
            align-self: flex-start;
            background-color: #0284c7;
            color: white;
            border-bottom-right-radius: 0;
        }
        .qaya-message {
            align-self: flex-end;
            background-color: #475569;
            color: #e2e8f0;
            border-bottom-left-radius: 0;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background-color: #334155;
            border-top: 1px solid #475569;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #0f172a;
            color: white;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            padding: 12px 24px;
            margin-right: 10px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .log-box {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
            text-align: right;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>مختبر قايا QAYA</h1>
        <p style="margin: 5px 0 0; font-size: 14px; color: #cbd5e1;">النواة، العقل المحلي، ومحرك الأوامر</p>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message qaya-message">
            مرحباً! أنا قايا، النواة جاهزة والمساحة مهيأة. كيف يمكنني مساعدتك؟<br>
            <small style="color:#94a3b8">جرب: "يا قايا ما هي حالة النظام؟" أو "اقرأ ملف QAYA_TEST.txt"</small>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب أمرك هنا..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user-message');
        userInput.value = '';

        try {
            const response = await fetch('/api/command', {
                method: 'POST',
                body: text
            });
            const result = await response.text();
            appendMessage(result, 'qaya-message');
        } catch (error) {
            appendMessage("حدث خطأ في الاتصال بنواة قايا.", 'qaya-message');
        }
    }

    function appendMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;

        // Handle line breaks
        div.innerHTML = text.replace(/\n/g, '<br>');

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
